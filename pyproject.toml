[project]
name = "research-sources"
version = "0.1.0"
description = "Read-only research sources (X, Reddit, Hacker News, YouTube, LinkedIn and App Store reviews) for agents, as one JSON CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
authors = [{ name = "Samuel Zhang" }]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rsrc = "rsrc.cli:main"

[project.urls]
Repository = "https://github.com/SamuelZ12/research-sources"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rsrc"
